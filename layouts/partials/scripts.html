  /* ── Slug al ── */
  function getSlug() {
    var m = window.location.pathname.match(/\/products\/([^\/]+)/);
    return m ? m[1] : null;
  }

  /* ── Ana çeviri fonksiyonu ── */
  function applyLang(lang) {
    var t = T[lang] || T.tr;
    var terms = TERMS[lang] || null;

    /* UI data-i18n */
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.textContent = t[key];
    });

    /* Navbar kategori linkleri */
    document.querySelectorAll('.nav-cat').forEach(function(el) {
      if (!el.dataset.origText) el.dataset.origText = el.textContent.trim();
      el.textContent = t[el.dataset.origText] || el.dataset.origText;
    });

    /* Ürün içeriği çevirisi */
    var slug = getSlug();
    document.querySelectorAll('.product-content').forEach(function(area) {

      /* 1. Açıklama paragrafı */
      var firstP = area.querySelector('p');
      if (firstP) {
        if (!firstP.dataset.origHtml) firstP.dataset.origHtml = firstP.innerHTML;
        if (lang === 'tr') {
          firstP.innerHTML = firstP.dataset.origHtml;
        } else if (slug && DESCS[slug] && DESCS[slug][lang]) {
          firstP.innerHTML = DESCS[slug][lang];
        }
      }

      /* 2. H3 başlıkları */
      if (terms) {
        area.querySelectorAll('h3').forEach(function(h) {
          if (!h.dataset.origText) h.dataset.origText = h.textContent.trim();
          h.textContent = terms[h.dataset.origText] || (lang === 'tr' ? h.dataset.origText : h.textContent);
        });
      } else {
        area.querySelectorAll('h3').forEach(function(h) {
          if (h.dataset.origText) h.textContent = h.dataset.origText;
        });
      }

      /* 3. <strong> etiketleri */
      if (terms) {
        area.querySelectorAll('strong').forEach(function(s) {
          if (!s.dataset.origText) s.dataset.origText = s.textContent.trim();
          var tr = terms[s.dataset.origText];
          if (tr) s.textContent = tr;
          else if (lang === 'tr' && s.dataset.origText) s.textContent = s.dataset.origText;
        });
      } else {
        area.querySelectorAll('strong').forEach(function(s) {
          if (s.dataset.origText) s.textContent = s.dataset.origText;
        });
      }

      /* 4. Li değerleri (strong sonrası metin) ve serbest bullet metinleri */
      var vals = VALS[lang] || null;
      var bullets = BULLETS[lang] || null;
      area.querySelectorAll('li').forEach(function(li) {
        var strong = li.querySelector('strong');
        if (strong) {
          var node = strong.nextSibling;
          while (node) {
            if (node.nodeType === 3) {
              if (!node._origText) node._origText = node.textContent;
              if (lang === 'tr') {
                node.textContent = node._origText;
              } else if (vals) {
                var trimmed = node._origText.trim();
                if (vals[trimmed]) node.textContent = node._origText.replace(trimmed, vals[trimmed]);
              }
              break;
            }
            node = node.nextSibling;
          }
        } else {
          if (!li.dataset.origText) li.dataset.origText = li.textContent.trim();
          if (lang === 'tr') {
            li.textContent = li.dataset.origText;
          } else if (bullets && bullets[li.dataset.origText]) {
            li.textContent = bullets[li.dataset.origText];
          }
        }
      });
    });

    /* 5. Ürün başlıkları */
    document.querySelectorAll('.product-title').forEach(function(el) {
      var s = el.dataset.slug;
      if (!el.dataset.origText) el.dataset.origText = el.textContent.trim();
      if (lang === 'tr') {
        el.textContent = el.dataset.origText;
      } else if (s && DESCS[s]) {
        var key = 'title' + lang.charAt(0).toUpperCase() + lang.slice(1);
        if (DESCS[s][key]) el.textContent = DESCS[s][key];
      }
    });

    /* Aktif buton + toggle başlığını güncelle */
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.classList.toggle('lang-active', btn.dataset.lang === lang);
    });
    var activeBtn = document.querySelector('.lang-btn[data-lang="' + lang + '"]');
    if (activeBtn) {
      var labelEl = document.getElementById('langLabel');
      if (labelEl) labelEl.textContent = activeBtn.dataset.label || lang.toUpperCase();
    }

    localStorage.setItem('thermex_lang', lang);
  }

  document.addEventListener('DOMContentLoaded', function() {
    var saved = localStorage.getItem('thermex_lang') || 'tr';
    applyLang(saved);

    /* Hamburger menü aç/kapat */
    var hamburger = document.getElementById('hamburgerBtn');
    var mainNav = document.getElementById('mainNav');
    if (hamburger && mainNav) {
      hamburger.addEventListener('click', function(e) {
        e.stopPropagation();
        mainNav.classList.toggle('nav-open');
      });
      mainNav.querySelectorAll('.nav-link').forEach(function(link) {
        link.addEventListener('click', function() {
          mainNav.classList.remove('nav-open');
        });
      });
      document.addEventListener('click', function() {
        mainNav.classList.remove('nav-open');
      });
    }

    /* Dropdown aç/kapat */
    var dropdown = document.getElementById('langDropdown');
    var toggle = document.getElementById('langToggle');
    if (toggle && dropdown) {
      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });
      document.addEventListener('click', function() {
        dropdown.classList.remove('open');
      });
    }

    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        applyLang(btn.dataset.lang);
        if (dropdown) dropdown.classList.remove('open');
      });
    });
  });
})();
